<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="LOCK IN ENGLISH"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>LOCK IN ENGLISH</title></head><body><main class="shell"><header><div><div class="eyebrow">2030 WORLD CUP PROJECT</div><h1>LOCK IN <span>ENGLISH</span></h1></div><div class="pill">BASIC 001 · 100 WORDS</div></header><nav><button class="tab active" data-tab="study">学習</button><button class="tab" data-tab="list">単語一覧</button><button class="tab" data-tab="settings">設定</button></nav><section id="study" class="panel"><div class="stats"><div><strong id="knownCount">0</strong><small>習得中・復習待ち</small></div><div><strong id="dueCount">0</strong><small>本日の出題対象</small></div><div><strong id="totalCount">100</strong><small>総単語数</small></div></div><div class="progress"><div id="progressFill"></div></div><p class="muted" id="progressText"></p><div id="card" class="word-card"><div class="eyebrow" id="cardIndex">WORD 1</div><div class="ipa" id="ipa"></div><div class="word" id="word"></div><button id="speak" class="audio">🔊 発音を聞く</button><button id="reveal" class="reveal">意味・例文を見る</button><div id="answer" hidden><div class="meaning" id="meaning"></div><div class="example" id="example"></div><div class="translation" id="translation"></div></div></div><div class="actions"><button id="known" class="known" disabled>✓ わかった！</button><button id="again" class="again" disabled>↻ わからなかった</button></div><p class="muted center" id="studyMessage"></p></section><section id="list" class="panel" hidden><div class="list-head"><input id="search" placeholder="単語を検索 / Search" autocomplete="off"><select id="filter"><option value="all">すべて</option><option value="new">未習得</option><option value="review">復習待ち</option><option value="due">復習日到来</option></select></div><div id="wordList"></div></section><section id="settings" class="panel" hidden><h2>学習データ</h2><p>進捗はこの端末・ブラウザ内に保存されます。PCとiPhone間で自動同期はされません。</p><div class="settings-actions"><button id="export">進捗をJSONで保存</button><label class="import-label">進捗を読み込む<input type="file" id="import" accept="application/json,.json" hidden></label><button id="reset" class="danger">学習記録をリセット</button></div><p class="muted">「わかった！」で3日後→7日後→14日後→30日後に復習。復習失敗時は未習得に戻ります。単語を完全に覚えた後も30日間隔で復習します。</p></section><footer>SMALL STEPS. EVERY DAY. · ROAD TO 2030</footer></main><script src="app.js" defer></script></body></html>
